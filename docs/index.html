<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meier Ghost Basic – Demo wird vorbereitet</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f4f1; color: #171717; }
    main { width: min(680px, calc(100% - 40px)); padding: 48px; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px rgba(0,0,0,.08); }
    span { color: #c62828; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1; }
    p { color: #5e5e5e; line-height: 1.7; }
    a { color: #c62828; }
    @media (prefers-color-scheme: dark) { body { background: #121212; color: #f7f7f7; } main { background: #1d1d1d; } p { color: #bdbdbd; } }
  </style>
</head>
<body>
  <main>
    <span>Herr Meier Themes</span>
    <h1>Meier Ghost Basic</h1>
    <p>Die interaktive Theme-Demo wird gerade vorbereitet. Das kostenlose Theme und weitere Informationen findest du auf <a href="https://www.herr-meier.de/ghost-basic-theme/">Herr-Meier.de</a>.</p>
  </main>
</body>
</html>
