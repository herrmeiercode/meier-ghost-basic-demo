name: Ghost-Demo auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Statische Demo paketieren
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Demo veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
